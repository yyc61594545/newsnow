name: debug sources (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests yt-dlp

      - name: yt-dlp raw probe (stderr visible)
        continue-on-error: true
        run: |
          yt-dlp --version
          echo "--- date-sorted search URL ---"
          yt-dlp "https://www.youtube.com/results?search_query=Claude+Code+tips&sp=CAISBAgCEAE%3D" \
            --dump-json --playlist-end 3 --ignore-errors 2>&1 | head -40
          echo "--- plain ytsearch ---"
          yt-dlp "ytsearch2:Claude Code tips" --dump-json --ignore-errors 2>&1 | head -20

      - name: aggregate probe
        continue-on-error: true
        run: python3 daily-research/scripts/aggregate.py --task ai-tools --days 3 --out /tmp/items.json
