name: debug sources (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests yt-dlp

      - name: probe A - node as JS runtime
        continue-on-error: true
        run: |
          node --version
          yt-dlp "https://www.youtube.com/results?search_query=Claude+Code+tips&sp=CAISBAgCEAE%3D" \
            --js-runtimes node --dump-json --playlist-end 3 --ignore-errors 2>&1 \
            | grep -oE '"(id|title|upload_date)": "[^"]*"|ERROR.*|WARNING.*' | head -20

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: probe B - deno as JS runtime
        continue-on-error: true
        run: |
          deno --version | head -1
          yt-dlp "https://www.youtube.com/results?search_query=Claude+Code+tips&sp=CAISBAgCEAE%3D" \
            --dump-json --playlist-end 3 --ignore-errors 2>&1 \
            | grep -oE '"(id|title|upload_date)": "[^"]*"|ERROR.*|WARNING.*' | head -20

      - name: aggregate probe
        continue-on-error: true
        run: python3 daily-research/scripts/aggregate.py --task ai-tools --days 3 --out /tmp/items.json
