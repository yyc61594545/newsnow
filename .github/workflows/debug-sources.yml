name: debug sources (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests yt-dlp

      - name: probe C - flat-playlist (search page only, no player)
        continue-on-error: true
        run: |
          yt-dlp "https://www.youtube.com/results?search_query=Claude+Code+tips&sp=CAISBAgCEAE%3D" \
            --flat-playlist --dump-json --playlist-end 5 --no-warnings 2>&1 \
            | grep -oE '"(id|title|view_count|channel)": ?("[^"]*"|[0-9]+)|ERROR.*' | head -25

      - name: aggregate probe
        continue-on-error: true
        run: python3 daily-research/scripts/aggregate.py --task ai-tools --days 3 --out /tmp/items.json
